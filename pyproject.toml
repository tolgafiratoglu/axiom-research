[project]
name = "axiom-research"
version = "0.1.0"
description = "AxiomResearch — energy and materials research intelligence"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
    "mcp[cli]>=2,<3",
    "httpx2>=2.5.0",
    "websockets>=13,<17",
    "starlette>=0.40",
    "uvicorn[standard]>=0.32",
    "psycopg[binary]>=3.2",
    "strands-agents[gemini]>=1.0",
]

[project.scripts]
axiom-mcp-literature = "axiom_research.mcp.servers.literature:main"
axiom-mcp-materials = "axiom_research.mcp.servers.materials:main"
axiom-mcp-research-data = "axiom_research.mcp.servers.research_data:main"
axiom-db-migrate = "axiom_research.db.migrate:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio",
    "ruff>=0.6",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/axiom_research"]

[tool.hatch.build.targets.wheel.sources]
"packages" = ""

[tool.hatch.build.targets.wheel.force-include]
"packages/axiom_research/db/migrations" = "axiom_research/db/migrations"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["packages", "."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages", "api", "verifier", "mcp", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["axiom_research", "api"]
